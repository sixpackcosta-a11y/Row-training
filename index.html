function normalizeAltName(txt){
  return String(txt||"").replace(/\s*·.*$/,"").trim();
}
function altExerciseCard(altTxt,exerciseIndex){
  const name=normalizeAltName(altTxt);
  const a=alternativeExerciseLibrary[name] || {
    img:null, dose:(String(altTxt).includes("·")?String(altTxt).split("·").slice(1).join("·").trim():"Según sesión"),
    rest:"60-90 s",
    how:"Realiza la variante con movimiento controlado y sin dolor. Usa una carga que te permita terminar cada serie con 2-3 repeticiones en reserva.",
    keys:"Técnica estable · recorrido cómodo · sin llegar al fallo.",
    error:"Forzar el movimiento o utilizar una carga que altere la técnica."
  };
  let visual="";
  if(a.asset){
    visual=`<div class="altVisual">${renderSingleImage(a.asset,name,"realPhoto")}</div>`;
  }else if(a.img && visuals[a.img]){
    visual=`<div class="altVisual">${renderSingleImage(visuals[a.img].src,name,"realPhoto")}</div>`;
  }else{
    visual=`<div class="altVisual"><div class="altNoVisual">Guía visual<br>del movimiento</div></div>`;
  }
  return `<div class="altCard" data-altcard="${exerciseIndex}" data-altname="${encodeURIComponent(name)}">
    <div class="altHead">
      ${visual}
      <div>
        <div class="altName">${name}</div>
        <div class="altDose">${a.dose}${a.rest?` · Descanso ${a.rest}`:""}</div>
      </div>
    </div>
    <details>
      <summary>📖 Cómo hacerlo</summary>
      <p><b>Cómo:</b> ${a.how}</p>
      <p><b>Claves:</b> ${a.keys}</p>
      <p><b>Evita:</b> ${a.error}</p>
      <a class="btn" target="_blank" href="https://www.youtube.com/results?search_query=${encodeURIComponent(name+" técnica ejercicio")}">▶️ Ver vídeo</a>
    </details>
    <button type="button" class="altChoose" data-ex="${exerciseIndex}" data-alt="${encodeURIComponent(name)}">✓ Elegir esta alternativa</button>

function timeTextToSeconds(v){
  if(!v)return null;
  const p=v.trim().split(":").map(Number);
  if(p.some(Number.isNaN))return null;
  if(p.length===2)return p[0]*60+p[1];
  if(p.length===3)return p[0]*3600+p[1]*60+p[2];
  return Number(v)||null;
}

function secondsToTime(sec){
  if(!sec && sec!==0)return "";
  const m=Math.floor(sec/60), s=Math.round(sec%60);
  return `${m}:${String(s).padStart(2,"0")}`;
}

async function runErgoOCRMulti(files){
  const status=document.getElementById("ocrStatus");
  const txt=document.getElementById("ocrText");
  let combined=[];
  for(let i=0;i<files.length;i++){
    status.textContent=`Leyendo foto ${i+1} de ${files.length}…`;
    try{
      const {data}=await Tesseract.recognize(files[i],"eng");
      combined.push(`--- FOTO ${i+1} ---\n${(data.text||"").trim()}`);
    }catch(e){ combined.push(`--- FOTO ${i+1}: no se pudo leer ---`); }
  }
  txt.value=combined.join("\n\n");
  status.textContent=`Lectura terminada (${files.length} foto${files.length===1?"":"s"}). Revisa los datos antes de guardar.`;
  // La extracción automática usa cada foto; los campos nunca se bloquean y pueden corregirse manualmente.
  for(const f of files){ await runErgoOCR(f,true); }
  txt.value=combined.join("\n\n");
}

async function runErgoOCR(file,multiMode=false){
  const status=document.getElementById("ocrStatus");
  const txt=document.getElementById("ocrText");
  try{
    status.textContent="Leyendo la pantalla…";
    const {data:{text}}=await Tesseract.recognize(file,"eng",{
      logger:m=>{
        if(m.status==="recognizing text" && status){
          status.textContent=`Leyendo… ${Math.round((m.progress||0)*100)}%`;
        }
      }
    });
    txt.value=text.trim();
    if(!multiMode) status.textContent="Lectura terminada. Revisa los datos antes de guardar.";

    // Heuristics: detect common erg screen values. Always leave user in control.
    const compact=text.replace(/\s+/g," ");
    const times=[...compact.matchAll(/\b(\d{1,2}:\d{2}(?:\.\d)?)\b/g)].map(m=>m[1]);
    const nums=[...compact.matchAll(/\b(\d{3,5})\b/g)].map(m=>Number(m[1]));
    if(times[0])ergoTime.value=times[0];
    if(times[1])ergoPace.value=times[1];
    const plausibleDistance=nums.find(n=>n>=100 && n<=50000);
    if(plausibleDistance)ergoDistance.value=plausibleDistance;
  }catch(err){
    status.textContent="No se pudo leer automáticamente. Puedes introducir los datos manualmente.";
  }
}

    <div class="grid"><label>Peso (kg)<input id="w${n}" type="number" step=".5"></label><label>Repeticiones<input id="rp${n}" type="number"></label></div>
    <div class="choices"><label><input type="radio" name="f${n}" value="Fácil"> Fácil</label><label><input type="radio" name="f${n}" value="Bien" checked> Bien</label><label><input type="radio" name="f${n}" value="Duro"> Duro</label></div>
    <label>Nota (opcional)<textarea id="note${n}" placeholder="Añade una nota..."></textarea></label>
  </div>`).join("")}<button class="primary">Guardar entrenamiento</button></form></div>`;

  back.onclick=()=>{tab="semana";draw();render()};

  document.querySelectorAll(".altChoose").forEach(btn=>{
    btn.onclick=()=>{
      const n=Number(btn.dataset.ex);
      const chosen=decodeURIComponent(btn.dataset.alt);
      gymVariantSelections[n]=chosen;
      const st=document.getElementById("variantStatus"+n);
      if(st) st.innerHTML=`Se registrará como alternativa: <b>${chosen}</b>`;
      document.querySelectorAll(`.altChoose[data-ex="${n}"]`).forEach(b=>b.classList.remove("selected"));
      btn.classList.add("selected");
    };
  });

  document.querySelectorAll(".mainChoose").forEach(btn=>{
    btn.onclick=()=>{
      const n=Number(btn.dataset.main);
      delete gymVariantSelections[n];
      const st=document.getElementById("variantStatus"+n);
      if(st) st.innerHTML=`Se registrará: <b>${gs.items[n].name}</b>`;
      document.querySelectorAll(`.altChoose[data-ex="${n}"]`).forEach(b=>b.classList.remove("selected"));
    };
  });

  gf.onsubmit=async e=>{
    e.preventDefault();
    const {data:workout,error:werr}=await sb.from("workout_logs").insert({
      user_id:currentUser.id,session_code:"GYM-"+k,session_type:"gym",status:"completed"
    }).select("id").single();
    if(werr)return alert(werr.message);

    const rows=gs.items.map((i,n)=>{
      const selected=gymVariantSelections[n]||i.name;
      const typedNote=document.getElementById("note"+n).value||"";
      const note=(selected!==i.name?`[[ASIGNADO:${i.name}]] `:"")+typedNote;
      return {
        workout_id:workout.id,
        user_id:currentUser.id,
        exercise_name:selected,
        weight_kg:document.getElementById("w"+n).value?Number(document.getElementById("w"+n).value):null,
        reps:document.getElementById("rp"+n).value?Number(document.getElementById("rp"+n).value):null,
        perceived_difficulty:document.querySelector(`input[name=f${n}]:checked`).value==="Fácil"?"easy":document.querySelector(`input[name=f${n}]:checked`).value==="Duro"?"hard":"good",
        note:note||null
      };
    });
    const {error:gerr}=await sb.from("gym_exercise_results").insert(rows);
    if(gerr)return alert(gerr.message);
    alert("Entrenamiento guardado y sincronizado");
    tab="hist";draw();render();
  };
}

function estimateMaxHR(age, sex, trained){
  age=Number(age);
  if(!age || age<10 || age>100) return null;

  if(trained){
    // Whyte et al. equations commonly cited for trained athletes.
    if(sex==="female") return Math.round(216 - 1.09*age);
    if(sex==="male") return Math.round(202 - 0.55*age);
  }

  // General fallback: Tanaka.
  return Math.round(208 - 0.7*age);
}

function karvonenZones(maxHr, restHr){
  const reserve=maxHr-restHr;
  if(!maxHr || !restHr || reserve<=0) return null;

  const z=(low,high)=>({
    min:Math.round(restHr + reserve*low),
    max:Math.round(restHr + reserve*high)
  });

  return {
    ut2:z(0.55,0.65),
    ut1:z(0.65,0.75),
    at:z(0.75,0.85),
    tr:z(0.85,0.95),
    an:z(0.95,1.00)
  };
}



async function withRetry(fn, attempts=3){
  let lastErr=null;
  for(let i=0;i<attempts;i++){
    try{
      const result=await fn();
      if(result?.error) return result;
      return result;
    }catch(err){
      lastErr=err;
      if(i<attempts-1) await new Promise(r=>setTimeout(r,700*(i+1)));
    }
  }
  throw lastErr;
}


const CONCEPT2_CLIENT_ID="bx8m9j1Qj8GZnN3ni8Wz5QEb15SHB9amysaSgelu";
const CONCEPT2_REDIRECT_URI="https://rowtraining.vercel.app/concept2-callback.html";
const CONCEPT2_SCOPE="user:read,results:read";

function connectConcept2(){
  const state=(crypto?.randomUUID?.() || (Date.now()+"-"+Math.random())).replace(/[^a-zA-Z0-9_-]/g,"");
  sessionStorage.setItem("concept2_oauth_state",state);
  const u=new URL("https://log.concept2.com/oauth/authorize");
  u.searchParams.set("client_id",CONCEPT2_CLIENT_ID);
  u.searchParams.set("scope",CONCEPT2_SCOPE);
  u.searchParams.set("response_type","code");
  u.searchParams.set("redirect_uri",CONCEPT2_REDIRECT_URI);
  u.searchParams.set("state",state);
  location.href=u.toString();
}
async function profile(){
  const {data:pdata}=await sb.from("profiles").select("*").eq("user_id",currentUser.id).single();
  const {data:mdata}=await sb.from("athlete_metrics").select("*").eq("user_id",currentUser.id).order("recorded_at",{ascending:false}).limit(1);
  const m=mdata?.[0]||{};

  const savedAge=localStorage.getItem("remo_age")||"";
  const savedSex=localStorage.getItem("remo_sex")||"";
  const savedTrained=localStorage.getItem("remo_trained")==="1";

  content.innerHTML=`<div class="card"><h2>Perfil</h2>
  <label>Nombre<input id="pf_name" value="${pdata?.full_name||""}"></label>
  <label>Altura (cm)<input id="pf_height" type="number" step=".1" value="${pdata?.height_cm??""}"></label>

  <div class="grid">
    <label>Peso (kg)<input id="pf_weight" type="number" step=".1" value="${m.weight_kg??""}"></label>
    <label>FC reposo<input id="pf_rest" type="number" value="${m.resting_hr??""}"></label>
  </div>

  <div class="card" style="background:#f8fafc">
    <h3>FC máxima</h3>
    <label>FC máxima conocida
      <input id="pf_max" type="number" value="${m.max_hr??""}" placeholder="Ej. 188">
    </label>

    <div class="muted" style="margin:8px 0 12px">Si no la conoces, puedes estimarla por edad.</div>

    <div class="grid">
      <label>Edad<input id="pf_age" type="number" min="10" max="100" value="${savedAge}"></label>
      <label>Sexo
        <select id="pf_sex" style="width:100%;font-size:16px;padding:10px;border:1px solid #c8d4e2;border-radius:9px;margin:4px 0 8px">
          <option value="">Seleccionar</option>
          <option value="male" ${savedSex==="male"?"selected":""}>Hombre</option>
          <option value="female" ${savedSex==="female"?"selected":""}>Mujer</option>
        </select>
      </label>
    </div>

    <label class="keepLogin">
      <input id="pf_trained" type="checkbox" ${savedTrained?"checked":""}>
      Deportista entrenado
    </label>

    <div class="actions">
      <button id="estimateHr" type="button">Estimar FC máx por edad</button>
    </div>
    <div id="estimateInfo" class="muted" style="margin-top:8px"></div>
  </div>

  <div class="info">
    <b>Zonas automáticas por Karvonen</b><br>
    Se calculan con FC máxima + FC de reposo. Si la FC máxima es estimada, las zonas también son orientativas.
  </div>

  <div class="actions">
    <button id="calcZones" type="button">Calcular zonas</button>
  </div>

  <h3>Zonas FC</h3>
  ${["ut2","ut1","at","tr","an"].map(z=>`<div class="grid">
    <label>${z.toUpperCase()} mín<input id="${z}_min" type="number" value="${m[z+"_min"]??""}"></label>
    <label>${z.toUpperCase()} máx<input id="${z}_max" type="number" value="${m[z+"_max"]??""}"></label>
  </div>`).join("")}

  <label>Notas<textarea id="pf_notes">${m.notes??""}</textarea></label>
  <div id="saveProfileStatus" class="saveStatus hidden"></div>
  <button id="saveProfile" class="primary">Guardar perfil</button>
  </div>
  <div class="card">
    <h2>Concept2 / ErgData</h2>
    <p>Conecta tu propia cuenta de Concept2 para comprobar que Row Training puede leer tus entrenamientos sincronizados desde ErgData.</p>
    <div class="info"><b>Piloto seguro:</b> esta prueba solo lee tus datos. No escribe resultados en Concept2 y todavía no guarda el token de conexión.</div>
    <button id="connectConcept2" type="button" class="primary">Conectar Concept2</button>
    <p class="muted"><small>Permisos solicitados: perfil y resultados en modo lectura.</small></p>
  </div>`;

  function fillZones(){
    const maxHr=Number(pf_max.value);
    const restHr=Number(pf_rest.value);
    const zones=karvonenZones(maxHr,restHr);
    if(!zones) return alert("Introduce una FC máxima y una FC de reposo válidas.");
    Object.entries(zones).forEach(([z,v])=>{
      document.getElementById(z+"_min").value=v.min;
      document.getElementById(z+"_max").value=v.max;
    });
  }

  function estimateHrMax(){
    const age=Number(pf_age.value);
    const sex=pf_sex.value;
    const trained=pf_trained.checked;

    if(!age) return alert("Introduce la edad.");
    if(trained && !sex) return alert("Selecciona el sexo para usar la fórmula de deportistas.");

    const estimated=estimateMaxHR(age,sex,trained);
    if(!estimated) return alert("No se pudo calcular la FC máxima.");

    pf_max.value=estimated;

    const formula = trained
      ? (sex==="female" ? "Whyte: 216 − 1,09 × edad" : "Whyte: 202 − 0,55 × edad")
      : "Tanaka: 208 − 0,7 × edad";

    estimateInfo.innerHTML=`FC máx estimada: <b>${estimated} lpm</b><br>${formula}<br><small>Es una estimación. Una FC máxima medida en test o competición tiene prioridad.</small>`;

    localStorage.setItem("remo_age",String(age));
    localStorage.setItem("remo_sex",sex);
    localStorage.setItem("remo_trained",trained?"1":"0");

    if(pf_rest.value) fillZones();
  }

  estimateHr.onclick=estimateHrMax;
  calcZones.onclick=fillZones;
  document.getElementById("connectConcept2").onclick=connectConcept2;

  // Auto-recalculate zones when HR values change.
  pf_max.addEventListener("change",()=>{ if(pf_rest.value) fillZones(); });
  pf_rest.addEventListener("change",()=>{ if(pf_max.value) fillZones(); });

  // If no zones are stored but HR data exists, fill them automatically.
  const hasSavedZones=["ut2","ut1","at","tr","an"].some(z=>m[z+"_min"]||m[z+"_max"]);
  if(!hasSavedZones && m.max_hr && m.resting_hr){
    setTimeout(fillZones,0);
  }

  saveProfile.onclick=async()=>{
    const status=document.getElementById("saveProfileStatus");
    const setStatus=(msg,type="")=>{
      status.className="saveStatus "+type;
      status.textContent=msg;
      status.classList.remove("hidden");
    };

    if(!navigator.onLine){
      setStatus("Sin conexión a Internet. No se ha guardado nada.","err");
      return;
    }

    saveProfile.disabled=true;
    setStatus("Guardando perfil…");

    try{
      localStorage.setItem("remo_age",pf_age.value||"");
      localStorage.setItem("remo_sex",pf_sex.value||"");
      localStorage.setItem("remo_trained",pf_trained.checked?"1":"0");

      const profileRes=await withRetry(()=>sb.from("profiles").update({
        full_name:pf_name.value,
        height_cm:pf_height.value?Number(pf_height.value):null,
        updated_at:new Date().toISOString()
      }).eq("user_id",currentUser.id));

      if(profileRes.error) throw new Error("Perfil: "+profileRes.error.message);

      const row={
        user_id:currentUser.id,
        weight_kg:pf_weight.value?Number(pf_weight.value):null,
        resting_hr:pf_rest.value?Number(pf_rest.value):null,
        max_hr:pf_max.value?Number(pf_max.value):null,
        notes:pf_notes.value||null
      };

      ["ut2","ut1","at","tr","an"].forEach(z=>{
        row[z+"_min"]=document.getElementById(z+"_min").value?Number(document.getElementById(z+"_min").value):null;
        row[z+"_max"]=document.getElementById(z+"_max").value?Number(document.getElementById(z+"_max").value):null;
      });

      setStatus("Guardando FC y zonas…");

      const metricRes=await withRetry(()=>sb.from("athlete_metrics").insert(row));
      if(metricRes.error) throw new Error("FC y zonas: "+metricRes.error.message);

      setStatus("Perfil, FC máxima y zonas guardados correctamente.","ok");
    }catch(err){
      console.error("Error guardando perfil",err);
      const network = /NetworkError|fetch|Failed to fetch/i.test(String(err?.message||err));
      setStatus(
        network
          ? "No se pudo conectar con Supabase. Revisa la conexión/VPN y vuelve a pulsar Guardar. La app no ha borrado tus datos."
          : "Error al guardar: "+(err?.message||err),
        "err"
      );
    }finally{
      saveProfile.disabled=false;
    }
  };
}
