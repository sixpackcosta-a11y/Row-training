function timeTextToSeconds(v){
  if(!v)return null;
  const p=v.trim().split(":").map(Number);
  if(p.some(Number.isNaN))return null;
  if(p.length===2)return p[0]*60+p[1];
  if(p.length===3)return p[0]*3600+p[1]*60+p[2];
  return Number(v)||null;
}

function secondsToTime(sec){
  if(!sec && sec!==0)return "";
  const m=Math.floor(sec/60), s=Math.round(sec%60);
  return `${m}:${String(s).padStart(2,"0")}`;
}

async function runErgoOCRMulti(files){
  const status=document.getElementById("ocrStatus");
  const txt=document.getElementById("ocrText");
  let combined=[];
  for(let i=0;i<files.length;i++){
    status.textContent=`Leyendo foto ${i+1} de ${files.length}…`;
    try{
      const {data}=await Tesseract.recognize(files[i],"eng");
      combined.push(`--- FOTO ${i+1} ---\n${(data.text||"").trim()}`);
    }catch(e){ combined.push(`--- FOTO ${i+1}: no se pudo leer ---`); }
  }
  txt.value=combined.join("\n\n");
  status.textContent=`Lectura terminada (${files.length} foto${files.length===1?"":"s"}). Revisa los datos antes de guardar.`;
  // La extracción automática usa cada foto; los campos nunca se bloquean y pueden corregirse manualmente.
  for(const f of files){ await runErgoOCR(f,true); }
  txt.value=combined.join("\n\n");
}

async function runErgoOCR(file,multiMode=false){
  const status=document.getElementById("ocrStatus");
  const txt=document.getElementById("ocrText");
  try{
    status.textContent="Leyendo la pantalla…";
    const {data:{text}}=await Tesseract.recognize(file,"eng",{
      logger:m=>{
        if(m.status==="recognizing text" && status){
          status.textContent=`Leyendo… ${Math.round((m.progress||0)*100)}%`;
        }
      }
    });
    txt.value=text.trim();
    if(!multiMode) status.textContent="Lectura terminada. Revisa los datos antes de guardar.";

    // Heuristics: detect common erg screen values. Always leave user in control.
    const compact=text.replace(/\s+/g," ");
    const times=[...compact.matchAll(/\b(\d{1,2}:\d{2}(?:\.\d)?)\b/g)].map(m=>m[1]);
    const nums=[...compact.matchAll(/\b(\d{3,5})\b/g)].map(m=>Number(m[1]));
    if(times[0])ergoTime.value=times[0];
    if(times[1])ergoPace.value=times[1];
    const plausibleDistance=nums.find(n=>n>=100 && n<=50000);
    if(plausibleDistance)ergoDistance.value=plausibleDistance;
  }catch(err){
    status.textContent="No se pudo leer automáticamente. Puedes introducir los datos manualmente.";
  }
}

function estimateMaxHR(age, sex, trained){
  age=Number(age);
  if(!age || age<10 || age>100) return null;

  if(trained){
    // Whyte et al. equations commonly cited for trained athletes.
    if(sex==="female") return Math.round(216 - 1.09*age);
    if(sex==="male") return Math.round(202 - 0.55*age);
  }

  // General fallback: Tanaka.
  return Math.round(208 - 0.7*age);
}

function karvonenZones(maxHr, restHr){
  const reserve=maxHr-restHr;
  if(!maxHr || !restHr || reserve<=0) return null;

  const z=(low,high)=>({
    min:Math.round(restHr + reserve*low),
    max:Math.round(restHr + reserve*high)
  });

  return {
    ut2:z(0.55,0.65),
    ut1:z(0.65,0.75),
    at:z(0.75,0.85),
    tr:z(0.85,0.95),
    an:z(0.95,1.00)
  };
}



async function withRetry(fn, attempts=3){
  let lastErr=null;
  for(let i=0;i<attempts;i++){
    try{
      const result=await fn();
      if(result?.error) return result;
      return result;
    }catch(err){
      lastErr=err;
      if(i<attempts-1) await new Promise(r=>setTimeout(r,700*(i+1)));
    }
  }
  throw lastErr;
}

async function connectConcept2(){

  const state=(crypto?.randomUUID?.() || (Date.now()+"-"+Math.random())).replace(/[^a-zA-Z0-9_-]/g,"");
  sessionStorage.setItem("concept2_oauth_state",state);
  const u=new URL("https://log.concept2.com/oauth/authorize");
  u.searchParams.set("client_id",CONCEPT2_CLIENT_ID);

function seasonPhaseForDate(dateStr){
  const m=Number(String(dateStr||'').slice(5,7));
  if(m===9||m===10) return 'BASE';
  if(m===11||m===12) return 'FUERZA';
  if(m===1) return 'TRANSFERENCIA';
  if(m===2||m===3) return 'PRECOMPETICIÓN';
  if(m===4) return 'ESPECÍFICO';
  if(m===5) return 'PUESTA A PUNTO';
  return 'BASE';
}

function metricSeconds(v){

}
function fmtMetricSeconds(v){if(v==null||!isFinite(v))return "—"; const m=Math.floor(v/60),sec=v-m*60;return `${m}:${sec.toFixed(1).padStart(4,'0')}`;}

function normalizeSeaKey(x){return String(x?.exercise_name||x?.session?.title||x?.title||'MAR').toLowerCase().replace(/^mar\s*[·:\-]?\s*/,'').replace(/\s+/g,' ').trim()}

 const [y,m]=ym.split('-').map(Number), days=new Date(Date.UTC(y,m,0)).getUTCDate();
 const first=(new Date(Date.UTC(y,m-1,1)).getUTCDay()+6)%7; let html='';

  const ds=`${ym}-${String(d).padStart(2,'0')}`, xs=sessions.filter(x=>x.session_date===ds), cs=comps.filter(x=>x.competition_date===ds), mars=xs.filter(x=>x.session_type==='MAR');

function compareSeaHtml(rows){

function autoRepeatedHtml(rows){

function seaResultEditor(sessionId){
 const opts=MAR_LIBRARY.map(x=>`<option value="${x[0]}"></option>`).join('');
 planArea.innerHTML=`<div class="card seaCard"><h3>Resultado MAR</h3><p class="muted">Guarda un registro por ejercicio o bloque si quieres poder repetirlo y compararlo automáticamente semanas o meses después.</p><label>Ejercicio / bloque<input id="seaExercise" list="seaExerciseOptions" placeholder="Ej. Pirámide 20-22-24-26-28"><datalist id="seaExerciseOptions">${opts}</datalist></label><div class="plannerGrid"><label>Metros<input id="seaMeters" type="number"></label><label>Tiempo<input id="seaTime" placeholder="Ej. 18:42.5"></label><label>Parcial medio /500 m<input id="seaPace" placeholder="Ej. 2:04.7"></label><label>PPM reales<input id="seaSpm" type="number" min="10" max="50"></label></div><label>RPE 1–10<input id="seaRpe" type="number" min="1" max="10"></label><label>Notas<textarea id="seaNotes" rows="4" placeholder="Técnica, viento, mar, tripulación, incidencias…"></textarea></label><button id="saveSea" class="primary">Guardar resultado</button> <button id="cancelSea">Cancelar</button></div>`;
 cancelSea.onclick=renderPlanDay; saveSea.onclick=async()=>{const q=await sb.from('sea_results').insert({training_session_id:Number(sessionId),exercise_name:seaExercise.value.trim()||null,distance_m:seaMeters.value?Number(seaMeters.value):null,time_text:seaTime.value.trim()||null,pace_500_text:seaPace.value.trim()||null,spm:seaSpm.value?Number(seaSpm.value):null,rpe:seaRpe.value?Number(seaRpe.value):null,notes:seaNotes.value.trim()||null});if(q.error)alert(q.error.message);else renderPlanDay();};
}

async function results(){
  content.innerHTML='<div class="card"><h2>Panel del entrenador</h2><div class="info"><b>Equipos:</b> Veteranas femenino · Senior masculino · Senior femenino · Veteranos masculino<br><small>El acceso de cada entrenador se controla por equipo.</small></div><p class="muted">Cargando…</p></div>';

  const {data:profiles,error:e1}=await sb.from("profiles").select("user_id,full_name,height_cm,team_code");
  const {data:roles,error:eRole}=await sb.from("user_roles").select("user_id,role");
  const {data:metrics,error:eM}=await sb.from("athlete_metrics").select("*").order("recorded_at",{ascending:false});
  const {data:workouts,error:e2}=await sb.from("workout_logs")
    .select("id,user_id,session_code,session_type,session_date,status,effort,feeling,notes,created_at")
    .order("created_at",{ascending:false});
  const {data:gym,error:e3}=await sb.from("gym_exercise_results")
    .select("id,workout_id,user_id,exercise_name,weight_kg,reps,perceived_difficulty,note,created_at")
    .order("created_at",{ascending:false});

  const {data:ergo,error:e4}=await sb.from("ergo_results").select("*").order("created_at",{ascending:false});
  const {data:c2results,error:e5}=await sb.from("concept2_results").select("*").order("workout_date",{ascending:false});

  const err=e1||eRole||eM||e2||e3||e4||e5;
  if(err){
    content.innerHTML=`<div class="card"><h2>Panel del entrenador</h2><p>${err.message}</p></div>`;
    return;
  }

  const athleteIds=new Set((roles||[]).filter(x=>x.role==="athlete").map(x=>x.user_id));
  const athletes=(profiles||[]).filter(p=>athleteIds.has(p.user_id));

  const prettyFeel=v=>v==="easy"?"Fácil":v==="hard"?"Duro":"Bien";
  const prettyStatus=v=>v==="completed"?"Completado":v==="partial"?"Parcial":"No realizado";

  content.innerHTML=`<div class="card">
    <h2>Panel del entrenador</h2>
    <p class="muted">${athletes.length} remeros</p>

    ${athletes.map((p,idx)=>{
      const ws=(workouts||[]).filter(w=>w.user_id===p.user_id);
      const latest=ws[0];
      const c2s=(c2results||[]).filter(r=>r.user_id===p.user_id);
      const c2last=c2s[0];
      return `<div class="card athleteCard">
        <div class="athleteHead">
          <div>
            <div class="big">${p.full_name||"Sin nombre"}</div>
            <div class="muted">${p.height_cm?`${p.height_cm} cm · `:""}${ws.length} entrenamientos registrados</div>
            ${(()=>{
              const mm=(metrics||[]).find(x=>x.user_id===p.user_id);
              return mm?`<div class="muted">FC reposo ${mm.resting_hr??"-"} · FC máx ${mm.max_hr??"-"} · UT2 ${mm.ut2_min??"-"}-${mm.ut2_max??"-"} · UT1 ${mm.ut1_min??"-"}-${mm.ut1_max??"-"} · AT ${mm.at_min??"-"}-${mm.at_max??"-"} · TR ${mm.tr_min??"-"}-${mm.tr_max??"-"} · AN ${mm.an_min??"-"}-${mm.an_max??"-"}</div>`:"";
            })()}
          </div>
          <div style="min-width:210px"><select class="athleteTeam" data-user="${p.user_id}" style="width:100%;padding:8px;border:1px solid #c8d4e2;border-radius:9px"><option value="">Sin equipo</option>${TEAM_OPTIONS.map(t=>`<option value="${t[0]}" ${p.team_code===t[0]?"selected":""}>${t[1]}</option>`).join("")}</select><button class="saveAthleteTeam" data-user="${p.user_id}" style="margin-top:6px;width:100%">Guardar equipo</button></div><button class="toggleAthlete" data-id="a${idx}">${ws.length?"Ver entrenamientos":"Sin entrenamientos"}</button>
        </div>
        ${latest?`<div class="last">
          <b>Último:</b> ${latest.session_code||latest.session_type||"Sesión"} · ${new Date(latest.created_at).toLocaleDateString("es-ES")}
        </div>`:""}
        <div id="a${idx}" class="hidden">
          ${ws.length?ws.map(w=>{
            const items=(gym||[]).filter(g=>g.workout_id===w.id);
            return `<div class="workoutDetail">
              <div class="workoutTitle">
                <b>${w.session_code||w.session_type||"Sesión"}</b>
                <span class="tag">${new Date(w.created_at).toLocaleString("es-ES")}</span>
              </div>
              <p><b>Estado:</b> ${prettyStatus(w.status)}</p>
              ${w.effort?`<p><b>Esfuerzo:</b> ${w.effort}/10</p>`:""}
              ${w.notes?`<p><b>Nota sesión:</b> ${w.notes}</p>`:""}
              ${items.length?`<div class="exerciseTable">
                ${items.map(i=>{const m=storedExerciseMeta(i);return `<div class="exerciseRow">
                  <div><b>${i.exercise_name}</b>${m.assigned?` <span class="tag">Alternativa</span><br><small>Asignado: ${m.assigned}</small>`:""}${m.userNote?`<br><small>${m.userNote}</small>`:""}</div>
                  <div>${i.weight_kg??"-"} kg</div>
                  <div>${i.reps??"-"} reps</div>
                  <div>${prettyFeel(i.perceived_difficulty)}</div>
                </div>`}).join("")}
              </div>`:""}
              ${(ergo||[]).filter(e=>e.workout_id===w.id).map(e=>`<div class="last">
                <b>Ergómetro</b><br>
                ${e.distance_m?`${e.distance_m} m · `:""}
                ${e.time_seconds?`Tiempo ${secondsToTime(e.time_seconds)} · `:""}
                ${e.pace_500_seconds?`/500 ${secondsToTime(e.pace_500_seconds)} · `:""}
                ${e.spm?`${e.spm} spm · `:""}
                ${e.avg_hr?`FC med ${e.avg_hr} · `:""}
                ${e.max_hr?`FC máx ${e.max_hr}`:""}
              </div>`).join("")}
              ${!items.length && !(ergo||[]).some(e=>e.workout_id===w.id)?`<p class="muted">Sin resultados asociados.</p>`:""}
            </div>`;
          }).join(""):"<p class='muted'>Aún no hay entrenamientos registrados.</p>"}
        </div>
      </div>`;
    }).join("")}
  </div>`;

  document.querySelectorAll(".toggleAthlete").forEach(b=>{
    b.onclick=()=>{
      const el=document.getElementById(b.dataset.id);
      el.classList.toggle("hidden");
      b.textContent=el.classList.contains("hidden")?"Ver entrenamientos":"Ocultar";
    };
  });
  document.querySelectorAll(".saveAthleteTeam").forEach(b=>{
    b.onclick=async()=>{
      const userId=b.dataset.user;
      const sel=document.querySelector(`.athleteTeam[data-user="${userId}"]`);
      const teamCode=sel.value||null;
      b.disabled=true; b.textContent="Guardando…";
      const q=await sb.from("profiles").update({team_code:teamCode}).eq("user_id",userId);
      if(q.error){ alert("No se pudo guardar el equipo: "+q.error.message); b.textContent="Guardar equipo"; }
      else { const a=athletes.find(x=>x.user_id===userId); if(a)a.team_code=teamCode; b.textContent="Guardado ✓"; setTimeout(()=>{b.textContent="Guardar equipo";b.disabled=false},1200); }
      if(q.error)b.disabled=false;
    };
  });
}
</script>
