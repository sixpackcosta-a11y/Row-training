<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Concept2 · Row Training</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#f4f7fb;color:#152235;margin:0;padding:24px}
main{max-width:720px;margin:0 auto}
.card{background:white;border-radius:16px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.07);margin:14px 0}
.ok{background:#e9f8ee} .err{background:#fff0f0} .muted{color:#637083}
button,a.btn{display:inline-block;border:0;border-radius:10px;padding:12px 16px;background:#1267d6;color:white;text-decoration:none;font-weight:700}
.result{border-top:1px solid #e6ebf2;padding:10px 0}
</style>
</head>
<body>
<main>
<div class="card"><h1>Concept2 · Row Training</h1><p id="status">Comprobando autorización…</p></div>
<div id="output"></div>
</main>
<script>
const expected=sessionStorage.getItem("concept2_oauth_state");
const q=new URLSearchParams(location.search);
const code=q.get("code");
const returnedState=q.get("state");
const error=q.get("error");
const status=document.getElementById("status");
const output=document.getElementById("output");

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

async function run(){
  if(error) throw new Error("Concept2 no autorizó la conexión: "+error);
  if(!code) throw new Error("No se ha recibido el código de autorización.");
  if(expected && returnedState && expected!==returnedState) throw new Error("La comprobación de seguridad (state) no coincide.");

  const r=await fetch("/api/concept2-pilot",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({code,redirect_uri:"https://rowtraining.vercel.app/concept2-callback.html"})
  });
  const data=await r.json();
  if(!r.ok) throw new Error(data?.error || "No se pudo conectar con Concept2.");

  sessionStorage.removeItem("concept2_oauth_state");
  status.textContent="Conexión correcta. Concept2 ha devuelto datos reales.";
  status.parentElement.classList.add("ok");

  const user=data.user||{};
  const rows=(data.results||[]).slice(0,10);
  output.innerHTML=`<div class="card">
    <h2>Cuenta conectada</h2>
    <p><b>${esc(user.name || user.username || "Usuario Concept2")}</b></p>
    <p class="muted">Piloto: no se ha guardado ningún token. Al cerrar esta prueba, la conexión no queda persistida.</p>
  </div>
  <div class="card"><h2>Últimos entrenamientos encontrados</h2>
    ${rows.length?rows.map(x=>`<div class="result"><b>${esc(x.date||"")}</b> · ${esc(x.distance??"-")} m · ${esc(x.time_formatted||x.time||"-")}<br><span class="muted">${esc(x.workout_type||x.type||"")} · origen: ${esc(x.source||"-")}</span></div>`).join(""):"<p>No se han encontrado resultados recientes.</p>"}
  </div>
  <div class="card"><a class="btn" href="/">Volver a Row Training</a></div>`;
}

run().catch(e=>{
  status.textContent=e.message;
  status.parentElement.classList.add("err");
  output.innerHTML='<div class="card"><a class="btn" href="/">Volver a Row Training</a></div>';
});
</script>
</body>
</html>
